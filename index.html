<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2">
<link rel="shortcut icon" href="./favicon.svg?v=3">

<link rel="shortcut icon" type="image/png" href="./pwa-192.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
.app-backbar{display:flex;align-items:center;margin:0 0 10px;min-height:34px}
.app-back-button{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 2px;border:0;background:transparent;color:var(--sub);font:600 13px Manrope,system-ui,sans-serif;cursor:pointer}
.app-back-button:active{color:var(--gold)}
.app-back-icon{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--bd);border-radius:50%;background:var(--card);color:var(--gold);font:400 27px/20px Manrope,system-ui,sans-serif;padding-bottom:3px}

:root{--bg:#161512;--card:#1f1e1a;--mut:#2a2823;--fg:#f1eee8;--sub:#a29e94;--gold:#d6aa5c;--ok:#5fc08a;--bad:#e5694f;--bd:#ffffff14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px Manrope,system-ui,sans-serif;color-scheme:dark}
h1,.big{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
main{max-width:760px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:34px;margin:8px 0 2px}.sub{color:var(--sub);font-size:13px}
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:#1a1915f2;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px);overflow-x:auto}
nav .brand{display:none}
nav .s2{display:none}
nav button{flex:1;min-width:72px;background:none;border:0;color:var(--sub);padding:10px 4px;font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px}nav button.on{color:var(--gold)}
nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:800px){nav{top:0;bottom:auto;right:auto;width:260px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);background:#1b1a17;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 22px;overflow:visible;gap:6px}
nav .brand{display:flex;align-items:center;gap:14px;font-family:"Instrument Serif",Georgia,serif;font-size:32px;margin:0 8px 26px}.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#e7bd7a,#b98846);display:grid;place-items:center;color:#1b1608}
nav button{flex:none;flex-direction:row;gap:16px;font-size:16px;padding:14px 18px;border-radius:99px;text-align:left}nav button.on{background:var(--mut);color:var(--fg)}
nav .s2{display:flex;margin-left:34px;padding:10px 18px;font-size:15px}nav .s2.on2{color:var(--gold);background:none}.tabs.mob{display:none}
main{margin:0 auto 0 260px;max-width:1100px;padding:28px 40px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;color:inherit;font:inherit}
.stat.hot{background:linear-gradient(135deg,#d9b068,#ad8040);color:#1b1608}.stat .big{font-size:44px;line-height:1}.stat small{font-size:12px;opacity:.8}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:26px 0 10px}h2 b{color:var(--gold)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;color:inherit;font:inherit}
.conversation-stage{padding:14px;border-radius:18px}.conversation-client-card{background:var(--card)!important;border:1px solid var(--bd)!important}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0}
.calendar-month{font-family:"Instrument Serif",Georgia,serif;font-size:27px;text-transform:capitalize}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-weekday{text-align:center;color:var(--sub);font-size:10px;padding:7px 0}
.calendar-day{min-height:66px;padding:7px 3px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);text-align:center;cursor:pointer;min-width:0}
.calendar-day.outside{opacity:.35}.calendar-day.today{border-color:var(--gold)}.calendar-day.selected{background:#d6aa5c20;border-color:var(--gold)}.calendar-day.has-appointments{background:#d6aa5c16;border-color:#d6aa5c99}.calendar-day-mark{display:block;margin:5px auto 0;width:max-content;padding:2px 5px;border-radius:99px;background:#d6aa5c26;color:var(--gold);font-size:9px;font-weight:700}
.calendar-day-number{font-size:13px}.calendar-day-count{display:block;margin:5px auto 0;min-width:17px;width:max-content;padding:2px 5px;border-radius:99px;background:#d6aa5c26;color:var(--gold);font-size:10px}
.calendar-list{margin-top:18px}.calendar-appointment{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.calendar-appointment-status{display:inline-block;color:var(--gold);background:#d6aa5c20;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700;margin-bottom:5px}.calendar-form{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:14px}
.calendar-empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:13px}
@media(max-width:390px){.calendar-day{min-height:58px;padding:6px 1px}.calendar-day-number{font-size:12px}.calendar-grid{gap:3px}}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.nm{font-weight:600}
.badge{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--mut);color:var(--sub);white-space:nowrap}
.badge.atrasado{background:#e5694f26;color:var(--bad)}.badge.hoje{background:#d6aa5c30;color:var(--gold)}.badge.proximo{background:#5fc08a22;color:var(--ok)}
input,select,textarea{width:100%;background:var(--mut);border:1px solid var(--bd);border-radius:10px;color:var(--fg);padding:11px;font:inherit;margin-top:4px}
label{display:block;font-size:12px;color:var(--sub);margin-top:12px}
.btn{background:var(--gold);color:#1b1608;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600}
.btn.alt{background:var(--mut);color:var(--fg)}.btn.wa{background:#3fbf6f;color:#07200f}.btn.del{background:none;color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px}.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--sub);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px}.tabs button.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.tabs .chipsel{width:auto;margin:0;flex:none;border:1px solid var(--bd);background:var(--card);color:var(--sub);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px}.tabs .chipsel.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:14px}
.doc-layout{display:grid;grid-template-columns:minmax(170px,.8fr) minmax(190px,1fr) minmax(260px,2fr);gap:12px;margin-top:18px;align-items:start}.doc-folder-row{display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--bd);padding:8px 0}.doc-folder-row .lnk{flex:1;text-align:left;overflow-wrap:anywhere}.doc-note-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--bd);padding:12px 4px;color:var(--fg);font:inherit}.doc-note-item.on{background:var(--mut);border-radius:9px}.doc-note-item strong,.doc-note-item span{display:block}.doc-note-item span{font-size:12px;color:var(--sub);margin-top:4px}.doc-title{font-size:22px;font-weight:600;border:0;background:transparent;padding:8px 0;margin-bottom:12px}.doc-body{min-height:48vh;resize:vertical;border:0;background:transparent;padding:8px 0;line-height:1.6}.doc-empty{min-height:45vh;display:grid;place-items:center;color:var(--sub);text-align:center}.conversation-card-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.conversation-card-info{min-width:0;flex:1}.conversation-card-info .sub{line-height:1.45}.conversation-wa{flex:0 0 auto;white-space:nowrap;padding:12px 16px}.conversation-card-head .lnk{font-size:inherit;text-align:left}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.note{color:var(--sub);font-size:12px;margin-top:20px}
.tbl{display:none;overflow:hidden;border:1px solid var(--bd);border-radius:18px;background:var(--card)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);background:#ffffff0a;padding:15px 12px;font-weight:600}
.tbl td{padding:17px 12px;border-top:1px solid var(--bd);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:22px}.tbl td.p{color:var(--sub)}.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:#ffffff08}
.badge.proximo{background:#d6aa5c1c;color:#e3c27d}.badge.em_dia{background:#5fc08a22;color:var(--ok)}
.lnk{background:none;border:0;color:var(--fg);font:inherit;padding:6px 0;cursor:pointer}
.kvs{display:grid;grid-template-columns:1fr;column-gap:40px}.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;color:var(--sub)}.kv b{color:var(--fg);font-weight:400;text-align:right}
.tl{position:relative;padding-left:26px}.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--bd)}.tl .it{position:relative}.tl .dot{position:absolute;left:-26px;top:22px;width:11px;height:11px;border-radius:50%;background:var(--gold)}
.ico{background:none;border:0;color:var(--sub);font-size:16px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid var(--bd);background:var(--mut);color:var(--sub);border-radius:99px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.msg{background:var(--mut);border-radius:16px 16px 16px 4px;padding:12px 14px;margin-top:10px;max-width:94%}.msg .row{margin-bottom:4px}
.info{grid-template-columns:1fr}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.fpanel{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}.fpanel .flt{margin-top:0}.fpanel .actions{margin-top:12px}
.kb{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.col{flex:1 0 230px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;min-height:110px}
.oc{background:var(--mut);border-radius:12px;padding:9px 11px;margin-top:8px;cursor:grab}.oc:active{cursor:grabbing}.sbs{width:auto;max-width:100%;margin:8px 0 0;padding:3px 9px;font-size:11px;border-radius:99px;color:var(--gold)}.meta{font-size:11.5px;color:var(--sub);margin-top:4px}.wab{background:#3fbf6f;color:#07200f;border-radius:99px;padding:4px 11px;font-size:11px;font-weight:600;text-decoration:none}.ac{display:flex;align-items:center;gap:6px;margin-top:8px}.dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.sbs{width:100%;border-radius:8px;padding:5px 8px;margin-top:8px}.ac{justify-content:space-between}.fu{margin-top:8px;font-size:11.5px;color:var(--sub);gap:6px}.fud{width:auto;margin:0;padding:3px 6px;font-size:11px;border-radius:8px}.hj{background:var(--card);border:1px solid var(--bd);color:var(--sub);border-radius:8px;padding:3px 8px;font-size:11px;margin-left:4px;cursor:pointer}.vl{color:var(--gold);font-weight:600}
.row.fu{display:block}.fu>span:first-child{display:block;margin-bottom:4px;white-space:nowrap}.fu>span:last-child{display:flex;gap:6px;align-items:center}.fud{flex:1;min-width:0}.hj{margin-left:0;white-space:nowrap}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}#lock.on{display:flex}.lbox{width:100%;max-width:340px;text-align:center}
.lbox .logo{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#e7bd7a,#b98846);display:grid;place-items:center;color:#1b1608}.lbox .logo svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lbox input{text-align:center;letter-spacing:.5em;font-size:22px;margin:16px 0 8px}
.chip .x{margin-left:8px;padding:2px 4px;cursor:pointer;opacity:.7}.chip .x:hover{opacity:1}
#dlg{position:fixed;inset:0;z-index:120;background:#000a;display:none;align-items:center;justify-content:center;padding:24px}#dlg.on{display:flex}.dbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;max-width:340px;width:100%}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--mut);border:1px solid var(--bd);border-radius:12px;padding:10px 16px;z-index:130;display:none;max-width:90%}#toast.on{display:block}
@media(min-width:800px){.kp{grid-template-columns:repeat(4,1fr)}}
@media(min-width:800px){.kvs{grid-template-columns:1fr 1fr}}
@media(min-width:800px){.tbl{display:block}.cards{display:none}.flt{grid-template-columns:repeat(4,1fr)}}


/* Documentos em lista vertical, inspirado no app Notas do iPhone */
.doc-layout{display:block!important}
.docs-ios{max-width:760px;margin:0 auto}
.doc-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 24px}
.doc-toolbar h1{margin:0 0 4px}
.doc-section-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 0 8px;padding:0 4px}
.doc-list-row{display:flex;align-items:center;gap:13px;width:100%;padding:15px 8px;text-align:left;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--bd);font:inherit;cursor:pointer}
.doc-list-row.selected{background:var(--mut);border-radius:10px}
.doc-list-icon{width:30px;flex:none;font-size:21px;text-align:center}
.doc-list-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.doc-list-main strong{font-size:15px;font-weight:600}
.doc-list-main small{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-chevron{font-size:25px;color:var(--sub);font-weight:300}
.doc-row-actions{display:flex;justify-content:flex-end;gap:16px;padding:2px 12px 8px;border-bottom:1px solid var(--bd)}
.doc-row-actions .lnk{font-size:12px;color:var(--sub)}
.doc-empty-short{min-height:150px;padding:40px 12px}
.doc-editor-ios{margin-top:10px}
.doc-editor-ios .doc-title{width:100%;font-size:27px;margin:8px 0 10px}
.doc-editor-ios .doc-body{width:100%;min-height:55vh;font-size:16px;line-height:1.65;resize:vertical}
.doc-editor-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bd);padding-top:12px}
@media(min-width:800px){.docs-ios{max-width:850px}}

/* Fotos dos clientes */
.avatar{width:42px;height:42px;min-width:42px;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;background:var(--mut);border:1px solid var(--bd);color:var(--gold);font-weight:600;font-size:14px;vertical-align:middle}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-photo-wrap{position:relative;display:inline-block;flex:none}
.profile-photo{width:104px;height:104px;min-width:104px;font-size:30px;padding:0;cursor:pointer;overflow:hidden}
.profile-photo:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.photo-camera-btn{position:absolute;right:-3px;bottom:-3px;width:34px;height:34px;display:grid;place-items:center;margin:0;border:2px solid var(--bg);border-radius:50%;background:var(--gold);color:#1b1608;cursor:pointer;box-shadow:0 2px 8px #0008}
.photo-camera-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.photo-camera-input{display:none}
.profile-head{display:flex;align-items:center;gap:16px;margin:18px 0 10px}
@media(max-width:420px){.profile-photo{width:82px;height:82px;min-width:82px}.photo-camera-btn{width:30px;height:30px}.profile-head h1{font-size:30px!important}}


/* Foto na tabela desktop */
.client-name-cell{display:flex;align-items:center;gap:10px;min-width:190px}
.table-avatar{width:36px;height:36px;min-width:36px;font-size:12px}

/* Ajuste de enquadramento da foto do cliente */
.photo-crop-overlay{position:fixed;inset:0;z-index:150;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.photo-crop-overlay.on{display:flex}
.photo-crop-card{width:min(100%,420px);max-height:94vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:0 18px 60px #0009}
.photo-crop-title{font-family:"Instrument Serif",Georgia,serif;font-size:28px;margin:0}
.photo-crop-viewport{width:min(82vw,320px);aspect-ratio:1;margin:16px auto 10px;position:relative;overflow:hidden;border-radius:14px;background:#111;touch-action:none;user-select:none;cursor:grab;border:1px solid var(--bd)}
.photo-crop-viewport:active{cursor:grabbing}
.photo-crop-image{position:absolute;max-width:none;max-height:none;width:auto;height:auto;pointer-events:none;user-select:none}
.photo-crop-help{text-align:center;color:var(--sub);font-size:12px;line-height:1.5}
.photo-crop-zoom{display:block;margin:16px 0 4px;color:var(--sub);font-size:12px}
.photo-crop-zoom input{padding:0;border:0;background:transparent;margin-top:12px;accent-color:var(--gold)}
.photo-crop-actions{display:flex;gap:8px;margin-top:18px}
.photo-crop-actions button{flex:1}
@media(max-height:620px){.photo-crop-card{max-height:98vh;padding:12px}.photo-crop-viewport{width:min(64vw,230px);margin:8px auto}.photo-crop-title{font-size:24px}}
/* Visualização ampliada da foto do cliente */
.photo-viewer-overlay{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:56px 18px 28px;background:#080807f5;backdrop-filter:blur(8px)}
.photo-viewer-overlay.on{display:flex}
.photo-viewer-image{display:block;max-width:min(100%,900px);max-height:calc(100vh - 150px);width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 14px 50px #0009}
.photo-viewer-close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:18px;width:42px;height:42px;display:grid;place-items:center;border:1px solid #ffffff2b;border-radius:50%;background:#ffffff16;color:#fff;font-size:28px;line-height:1;cursor:pointer}
.photo-viewer-caption{color:#fff;font-size:14px;text-align:center}
.photo-viewer-remove{margin-top:2px;border:0;background:none;color:#d6aa5c;font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
@media(max-width:600px){.photo-viewer-overlay{padding:56px 12px 24px}.photo-viewer-image{max-width:100%;max-height:calc(100vh - 140px)}}

/* Ordenação por situação dos clientes */
.client-sort-arrows{display:inline-flex;align-items:center;justify-content:center;gap:1px;height:38px;min-width:38px;padding:0 9px;background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--gold);font:300 18px/1 Manrope,system-ui,sans-serif;cursor:pointer}
.client-sort-arrows span{display:inline-block;opacity:1}
.client-sort-arrows .muted{opacity:.35}

.badge.new-client{background:#d6aa5c24;color:var(--gold)}
.badge.fixed-client{background:#5fc08a20;color:var(--ok)}
.badge.subscriber{background:#d6aa5c30;color:var(--gold)}

.subscriber-toggle{display:flex;align-items:center;gap:10px;min-height:42px;margin-top:12px;color:var(--sub)}
.subscriber-toggle input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--gold)}

async function signUp(){

async function resetPassword(){

  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});

async function signOut(){
  await syncCloud();await sb.auth.signOut();cloudUser=null;cloudReady=false;authView("Você saiu da sua conta.");

async function bootCloud(){
  const {data:{session},error:sessionError}=await sb.auth.getSession();
  if(sessionError||!session){cloudUser=null;authView();return}
  cloudUser=session.user;$("#nav").style.display="flex";
  const {data,error}=await sb.from("carteira_data").select("data").eq("user_id",cloudUser.id).maybeSingle();
  if(error){authView("Não foi possível carregar seus dados: "+error.message);return}
  let local=null;try{local=JSON.parse(localStorage.getItem("carteira")||"null")}catch(e){}
  if(data&&data.data){S=data.data;try{localStorage.setItem("carteira",JSON.stringify(S))}catch(e){}}
  else if(local&&Array.isArray(local.clients)&&(local.clients.length||(local.crm||[]).length)){
    S=local;cloudReady=true;await syncCloud();
  }else{
    S=local&&Array.isArray(local.clients)?local:{clients:[],crm:[],cfg:{}};
    cloudReady=true;await syncCloud();
  }
  cloudReady=true;render();lockUI();
}
async function init(){

    $("#app").innerHTML=`<div style="max-width:390px;margin:8vh auto;padding:24px"><h1>Carteira</h1><p class="sub">Não foi possível carregar a conexão do sistema. Confira sua internet e toque para tentar novamente.</p><button class="btn" onclick="location.reload()">Tentar novamente</button></div>`;

}

// Iniciais automáticas quando o cliente não tem foto
function initials(name){
  return String(name||"?").trim().split(/\s+/).slice(0,2)
    .map(part=>part[0]||"").join("").toUpperCase()||"?";
}

// Carrega a foto a partir de uma URL temporária e privada do Supabase
async function refreshPhotoUrls(){
  if(!cloudUser||!sb)return;
  for(const el of document.querySelectorAll("[data-photo-path]")){
    const path=el.getAttribute("data-photo-path");
    if(!path)continue;
    try{
      let signedUrl;
      const cached=photoUrlCache[path];
      if(cached&&cached.expires>Date.now()){
        signedUrl=cached.url;
      }else{
        const {data,error}=await sb.storage.from(PHOTO_BUCKET).createSignedUrl(path,3600);
        if(error)throw error;
        signedUrl=data.signedUrl;
        photoUrlCache[path]={url:signedUrl,expires:Date.now()+3300000};
      }
      const img=document.createElement("img");
      img.src=signedUrl;
      img.alt="Foto do cliente";
      el.replaceChildren(img);
    }catch(error){
      console.error("Erro ao carregar foto:",error);
    }
  }
}

// Abre o editor para enquadrar a foto antes do envio
function openPhotoCrop(input,id){
  const file=input.files&&input.files[0];
  input.value="";
  if(!file)return;
  if(!cloudUser){toast("Entre na sua conta para enviar fotos.");return;}
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    toast("Use uma imagem JPG, PNG ou WebP.");return;
  }
  if(file.size>5*1024*1024){toast("A imagem precisa ter até 5 MB.");return;}
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    photoCrop={id,file,img,url,zoom:1,x:0,y:0,scale:1,dragging:false};
    const modal=$("#photoCrop");
    modal.innerHTML =
      '<div class="photo-crop-card">' +
        '<h2 class="photo-crop-title">Ajustar foto</h2>' +
        '<p class="sub" style="margin:4px 0 0">Posicione o rosto dentro do quadrado.</p>' +
        '<div id="photoCropViewport" class="photo-crop-viewport" ' +
          'onpointerdown="startPhotoDrag(event)" ' +
          'onpointermove="movePhotoDrag(event)" ' +
          'onpointerup="endPhotoDrag(event)" ' +
          'onpointercancel="endPhotoDrag(event)">' +
          '<img id="photoCropImage" class="photo-crop-image" alt="Prévia do enquadramento">' +
        '</div>' +
        '<div class="photo-crop-help">Arraste a foto para centralizar. Ajuste o zoom até ficar do jeito que você quer.</div>' +
        '<label class="photo-crop-zoom">Zoom' +
          '<input id="photoZoom" type="range" min="1" max="3" step="0.01" value="1" oninput="setPhotoZoom(this.value)">' +
        '</label>' +
        '<div class="photo-crop-actions">' +
          '<button class="btn alt" onclick="cancelPhotoCrop()">Cancelar</button>' +
          '<button id="photoCropSave" class="btn" onclick="confirmPhotoCrop()">Usar esta foto</button>' +
        '</div>' +
      '</div>';
    modal.classList.add("on");
    modal.setAttribute("aria-hidden","false");
    requestAnimationFrame(()=>{
      const viewport=$("#photoCropViewport");
      const size=viewport.clientWidth;
      const scale=Math.max(size/img.naturalWidth,size/img.naturalHeight);
      photoCrop.scale=scale;
      photoCrop.x=(size-img.naturalWidth*scale)/2;
      photoCrop.y=(size-img.naturalHeight*scale)/2;
      $("#photoCropImage").src=url;
      drawPhotoCrop();
    });
  };
  img.onerror=()=>{
    URL.revokeObjectURL(url);
    toast("Não consegui abrir essa imagem. Tente outra foto.");
  };
  img.src=url;
}

function drawPhotoCrop(){
  if(!photoCrop)return;
  const viewport=$("#photoCropViewport");
  const image=$("#photoCropImage");
  if(!viewport||!image)return;
  const size=viewport.clientWidth;
  const width=photoCrop.img.naturalWidth*photoCrop.scale;
  const height=photoCrop.img.naturalHeight*photoCrop.scale;
  photoCrop.x=Math.min(0,Math.max(size-width,photoCrop.x));
  photoCrop.y=Math.min(0,Math.max(size-height,photoCrop.y));
  image.style.width=width+"px";
  image.style.height=height+"px";
  image.style.left=photoCrop.x+"px";
  image.style.top=photoCrop.y+"px";
}

function setPhotoZoom(value){
  if(!photoCrop)return;
  const viewport=$("#photoCropViewport");
  const size=viewport.clientWidth;
  const focusX=(size/2-photoCrop.x)/photoCrop.scale;
  const focusY=(size/2-photoCrop.y)/photoCrop.scale;
  const base=Math.max(size/photoCrop.img.naturalWidth,size/photoCrop.img.naturalHeight);
  photoCrop.zoom=Number(value);
  photoCrop.scale=base*photoCrop.zoom;
  photoCrop.x=size/2-focusX*photoCrop.scale;
  photoCrop.y=size/2-focusY*photoCrop.scale;
  drawPhotoCrop();
}

function startPhotoDrag(event){
  if(!photoCrop)return;
  event.preventDefault();
  photoCrop.dragging=true;
  photoCrop.pointerId=event.pointerId;
  photoCrop.startPointerX=event.clientX;
  photoCrop.startPointerY=event.clientY;
  photoCrop.startX=photoCrop.x;
  photoCrop.startY=photoCrop.y;
  event.currentTarget.setPointerCapture(event.pointerId);
}
function movePhotoDrag(event){
  if(!photoCrop||!photoCrop.dragging||event.pointerId!==photoCrop.pointerId)return;
  event.preventDefault();
  photoCrop.x=photoCrop.startX+(event.clientX-photoCrop.startPointerX);
  photoCrop.y=photoCrop.startY+(event.clientY-photoCrop.startPointerY);
  drawPhotoCrop();
}
function endPhotoDrag(event){
  if(!photoCrop||!photoCrop.dragging)return;
  if(event.pointerId!==undefined&&event.pointerId!==photoCrop.pointerId)return;
  photoCrop.dragging=false;
}
function cancelPhotoCrop(){
  if(photoCrop&&photoCrop.url)URL.revokeObjectURL(photoCrop.url);
  photoCrop=null;
  const modal=$("#photoCrop");
  modal.classList.remove("on");
  modal.setAttribute("aria-hidden","true");
  modal.innerHTML="";
}

async function confirmPhotoCrop(){
  if(!photoCrop)return;
  const button=$("#photoCropSave");
  button.disabled=true;
  button.textContent="Preparando...";
  try{
    const viewport=$("#photoCropViewport");
    const size=viewport.clientWidth;
    const canvas=document.createElement("canvas");
    canvas.width=1024;
    canvas.height=1024;
    const ctx=canvas.getContext("2d");
    const sx=Math.max(0,(0-photoCrop.x)/photoCrop.scale);
    const sy=Math.max(0,(0-photoCrop.y)/photoCrop.scale);
    const sw=Math.min(size/photoCrop.scale,photoCrop.img.naturalWidth-sx);
    const sh=Math.min(size/photoCrop.scale,photoCrop.img.naturalHeight-sy);
    ctx.drawImage(photoCrop.img,sx,sy,sw,sh,0,0,1024,1024);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.92));
    if(!blob)throw new Error("Não consegui preparar o recorte da foto.");
    const originalName=(photoCrop.file.name||"foto").replace(/\.[^.]+$/,"");
    const file=new File([blob],originalName+".jpg",{type:"image/jpeg",lastModified:Date.now()});
    const id=photoCrop.id;
    cancelPhotoCrop();
    await uploadClientPhoto(file,id);
  }catch(error){
    console.error("Erro ao ajustar foto:",error);
    button.disabled=false;
    button.textContent="Usar esta foto";
    toast("Não consegui preparar a foto: "+(error.message||"tente novamente."));
  }
}

// Enviar ou trocar foto
async function uploadClientPhoto(file,id){
  if(!file)return;
  if(!cloudUser){toast("Entre na sua conta para enviar fotos.");return;}
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    toast("Use uma imagem JPG, PNG ou WebP.");return;
  }
  if(file.size>5*1024*1024){toast("A imagem precisa ter até 5 MB.");return;}
  const client=S.clients.find(item=>item.id==id);
  if(!client)return;
  const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
  const path=cloudUser.id+"/"+id+"/"+Date.now()+"."+ext;
  try{
    toast("Enviando foto...");
    const {error}=await sb.storage.from(PHOTO_BUCKET).upload(path,file,{
      upsert:false,contentType:file.type
    });
    if(error)throw error;
    const previousPath=client.photo||"";
    client.photo=path;
    save();
    clearTimeout(cloudTimer);
    const synced=await syncCloud();
    if(!synced){
      client.photo=previousPath;
      save();
      clearTimeout(cloudTimer);
      await syncCloud();
      await sb.storage.from(PHOTO_BUCKET).remove([path]);
      throw new Error("A foto foi enviada, mas o cadastro não foi confirmado na nuvem. Tente novamente.");
    }
    if(previousPath){
      const {error:removeError}=await sb.storage.from(PHOTO_BUCKET).remove([previousPath]);
      if(removeError)console.warn("A foto antiga não foi removida:",removeError);
      delete photoUrlCache[previousPath];
    }
    delete photoUrlCache[path];
    render();
    await refreshPhotoUrls();
    toast("Foto salva e sincronizada!");
  }catch(error){
    console.error("Erro ao enviar foto:",error);
    toast("Não consegui enviar a foto: "+(error.message||"verifique sua conexão."));
  }
}

// Remover a foto sem apagar o cadastro ou o histórico
function removeClientPhoto(id){
  const client=S.clients.find(item=>item.id==id);
  if(!client||!client.photo)return;
  askC("Deseja remover a foto deste cliente?",async()=>{
    const path=client.photo;
    try{
      client.photo="";
      delete photoUrlCache[path];
      save();
      clearTimeout(cloudTimer);
      const synced=await syncCloud();
      if(!synced){
        client.photo=path;
        save();
        clearTimeout(cloudTimer);
        await syncCloud();
        throw new Error("Não consegui confirmar a remoção na nuvem.");
      }
      const {error}=await sb.storage.from(PHOTO_BUCKET).remove([path]);
      if(error)console.warn("Não consegui apagar o arquivo antigo:",error);
      render();
      toast("Foto removida e sincronizada!");
    }catch(error){
      console.error("Erro ao remover foto:",error);
      toast("Não consegui remover a foto: "+(error.message||"tente novamente."));
    }
  },"Remover foto");
}

let NAV_HISTORY=[],NAV_INDEX=0,NAV_READY=false,NAV_RESTORING=false,NAV_KEY="",NAV_SWIPE=null,NAV_SKIP_POPSTATE=false;
const navCopy=value=>value==null?value:JSON.parse(JSON.stringify(value));
function navRouteKey(){
  if(view==="clientes")return "clientes|"+(F.sub||"todos");

  if(view==="financeiro")return "financeiro|"+(FIN_TAB||"resumo")+"|"+(FIN_DETAIL_KEY||"");
  if(view==="documentos")return "documentos|"+(DOC_FOLDER_ID||"pastas")+"|"+(DOC_NOTE_ID||"");

}
function captureNavState(){
  return {view,cur,tab,F:navCopy(F),form:navCopy(form),FSEC,OF:navCopy(OF),UF:navCopy(UF),
    UNQ_Q,NORETURN_Q,FOPEN,clientSortUrgentFirst,RS,RNEW,CLIENT_REG_OPEN,REG_FASE,REG_TIPO,

  form=navCopy(state.form);FSEC=state.FSEC;OF=navCopy(state.OF);UF=navCopy(state.UF);
  UNQ_Q=state.UNQ_Q||"";NORETURN_Q=state.NORETURN_Q||"";FOPEN=!!state.FOPEN;
  if(typeof state.clientSortUrgentFirst==="boolean")clientSortUrgentFirst=state.clientSortUrgentFirst;

  RTXT=navCopy(state.RTXT)||{name:"",phone:""};RSV=navCopy(state.RSV)||[];RD=state.RD||RD;
  FIN_TAB=state.FIN_TAB||"resumo";FIN_YEAR=Number(state.FIN_YEAR)||new Date().getFullYear();FIN_MONTH=state.FIN_MONTH||"all";FIN_FORM=navCopy(state.FIN_FORM);FIN_MOV_FORM=navCopy(state.FIN_MOV_FORM);FIN_DETAIL_KEY=state.FIN_DETAIL_KEY||null;FIN_SERVICE_FILTER=state.FIN_SERVICE_FILTER||"all";FIN_SERVICE_GROUP=state.FIN_SERVICE_GROUP||"servicos";FIN_SERVICE_DETAIL_PERIOD=state.FIN_SERVICE_DETAIL_PERIOD||null;DOC_FOLDER_ID=state.DOC_FOLDER_ID||null;DOC_NOTE_ID=state.DOC_NOTE_ID||null;

function renderBackControl(){
  const app=$("#app");if(!app)return;
  const old=app.querySelector(".app-backbar");if(old)old.remove();
  if(view==="documentos"&&(DOC_FOLDER_ID||DOC_NOTE_ID))return;
  if(NAV_INDEX<=0)return;
  app.insertAdjacentHTML("afterbegin",'<div class="app-backbar"><button type="button" class="app-back-button" onclick="backNav()" aria-label="Voltar para a tela anterior"><span class="app-back-icon" aria-hidden="true">‹</span><span>Voltar</span></button></div>');
}
function trackNavRender(){
  const snapshot=captureNavState(),key=navRouteKey();
  if(!NAV_READY){
    NAV_READY=true;NAV_HISTORY=[snapshot];NAV_INDEX=0;NAV_KEY=key;
    history.replaceState({carteiraAppNav:true,carteiraAppNavIndex:0},"",location.href);
    history.pushState({carteiraAppNav:true,carteiraAppNavIndex:0,carteiraAppNavGuard:true},"",location.href);
  }else if(NAV_RESTORING){
    NAV_KEY=key;NAV_RESTORING=false;writeNavBrowserState();
  }else if(key!==NAV_KEY){
    NAV_HISTORY=NAV_HISTORY.slice(0,NAV_INDEX+1);
    NAV_HISTORY.push(snapshot);NAV_INDEX=NAV_HISTORY.length-1;NAV_KEY=key;
    history.pushState(Object.assign({},history.state||{},{carteiraAppNav:true,carteiraAppNavIndex:NAV_INDEX}),"",location.href);
  }else{
    NAV_HISTORY[NAV_INDEX]=snapshot;
  }
  renderBackControl();
}
function writeNavBrowserState(){
  if(!NAV_READY)return;
  const state=Object.assign({},history.state||{},{carteiraAppNav:true,carteiraAppNavIndex:NAV_INDEX});
  history.replaceState(state,"",location.href);
}
function restoreNavIndex(index){
  if(!Number.isInteger(index)||index<0||index>=NAV_HISTORY.length)return false;
  NAV_INDEX=index;
  const state=NAV_HISTORY[index];if(!state)return false;
  restoreNavState(state);NAV_RESTORING=true;render();writeNavBrowserState();
  setTimeout(()=>window.scrollTo(0,state.scrollY||0),40);
  return true;
}
function backNav(source){
  if(!NAV_READY||NAV_INDEX<=0)return;
  NAV_INDEX--;
  NAV_LAST_MANUAL_BACK=Date.now();
  restoreNavIndex(NAV_INDEX);
}
function collapseSavedEditNav(clientId){
  if(!NAV_READY||NAV_INDEX<1)return false;
  const current=NAV_HISTORY[NAV_INDEX],previous=NAV_HISTORY[NAV_INDEX-1];
  const editedId=current&&current.view==="form"&&((current.form&&current.form.id)||current.cur);
  const previousIsProfile=previous&&(previous.view==="ficha"||previous.view==="unqualifiedFicha")&&previous.cur==clientId;
  if(!current||!previousIsProfile||editedId!=clientId)return false;
  const keepScrollY=Number(previous.scrollY)||0;
  NAV_HISTORY=NAV_HISTORY.slice(0,NAV_INDEX);
  NAV_INDEX=NAV_HISTORY.length-1;
  NAV_KEY=navRouteKey();
  NAV_RESTORING=false;
  NAV_HISTORY[NAV_INDEX]=Object.assign(captureNavState(),{scrollY:keepScrollY});
  NAV_SKIP_POPSTATE=true;
  history.back();
  setTimeout(()=>window.scrollTo(0,keepScrollY),40);
  return true;
}
let NAV_LAST_MANUAL_BACK=0;
window.addEventListener("popstate",event=>{
  if(!NAV_READY)return;
  if(NAV_SKIP_POPSTATE){NAV_SKIP_POPSTATE=false;writeNavBrowserState();return;}
  // Se o gesto personalizado já voltou, ignora um eventual segundo popstate nativo.
  if(NAV_LAST_MANUAL_BACK&&Date.now()-NAV_LAST_MANUAL_BACK<500){
    NAV_LAST_MANUAL_BACK=0;writeNavBrowserState();return;
  }
  NAV_LAST_MANUAL_BACK=0;
  const requested=event.state&&event.state.carteiraAppNav?event.state.carteiraAppNavIndex:null;
  // Usa o índice do navegador apenas quando ele aponta claramente para uma etapa anterior.
  // Estados ausentes ou dessincronizados voltam exatamente uma tela no histórico interno.
  const target=Number.isInteger(requested)&&requested<NAV_INDEX?requested:NAV_INDEX-1;
  if(target>=0){
    restoreNavIndex(target);
  }else{
    // Na primeira tela, mantém o app aberto em vez de deixar o gesto fechar a navegação.
    history.pushState({carteiraAppNav:true,carteiraAppNavIndex:0,carteiraAppNavGuard:true},"",location.href);
  }
});
document.addEventListener("touchstart",event=>{
  if(event.touches.length!==1||!NAV_READY||NAV_INDEX<=0)return;
  const target=event.target;
  if(target&&target.closest&&target.closest("input,select,a,nav,.photo-crop-overlay,.photo-viewer-overlay,#dlg,#lock,[contenteditable=true]"))return;
  const touch=event.touches[0];if(touch.clientX>34)return;
  NAV_SWIPE={x:touch.clientX,y:touch.clientY,index:NAV_INDEX,claimed:false};
},{passive:true});
document.addEventListener("touchmove",event=>{
  if(!NAV_SWIPE||!event.touches.length)return;
  const touch=event.touches[0],dx=touch.clientX-NAV_SWIPE.x,dy=touch.clientY-NAV_SWIPE.y;
  if(dx>18&&dx>Math.abs(dy)*1.15){
    NAV_SWIPE.claimed=true;

},{passive:false});
document.addEventListener("touchend",event=>{
  if(!NAV_SWIPE)return;
  const start=NAV_SWIPE;NAV_SWIPE=null;
  const touch=event.changedTouches&&event.changedTouches[0];if(!touch)return;
  const dx=touch.clientX-start.x,dy=touch.clientY-start.y;
  if(NAV_INDEX===start.index&&dx>72&&dx>Math.abs(dy)*1.35)backNav("gesture");

/* Atualização do app por gesto de puxar para baixo no topo da tela */
let APP_PULL=null,APP_REFRESH_BUSY=false,APP_REFRESH_HIDE=null;
function appRefreshIndicator(label,loading){
  const el=$("#appRefresh");if(!el)return;
  el.querySelector(".app-refresh-label").textContent=label;
  el.classList.toggle("loading",!!loading);
  el.classList.add("on");el.setAttribute("aria-hidden","false");
}
function hideAppRefresh(){
  const el=$("#appRefresh");if(!el)return;
  el.classList.remove("on","loading");el.setAttribute("aria-hidden","true");
}
async function refreshAppNow(){
  if(APP_REFRESH_BUSY)return;
  APP_REFRESH_BUSY=true;clearTimeout(APP_REFRESH_HIDE);
  appRefreshIndicator("Verificando atualizações…",true);
  try{
    if(navigator.onLine===false)throw new Error("offline");
    if("serviceWorker" in navigator){
      const registration=await navigator.serviceWorker.getRegistration("./");
      if(registration){
        await registration.update();
        const worker=registration.installing||registration.waiting;
        if(worker&&worker.state!=="activated"&&worker.state!=="redundant"){
          await new Promise(resolve=>{
            let finished=false;
            const done=()=>{if(finished)return;finished=true;clearTimeout(timer);worker.removeEventListener("statechange",check);resolve()};
            const check=()=>{if(worker.state==="activated"||worker.state==="redundant")done()};
            const timer=setTimeout(done,3500);
            worker.addEventListener("statechange",check);
            check();
          });
        }
      }
    }
    appRefreshIndicator("Atualizado! Recarregando…",true);
    setTimeout(()=>window.location.reload(),250);
  }catch(error){
    appRefreshIndicator(error&&error.message==="offline"?"Sem conexão. Tente novamente quando estiver online.":"Não consegui verificar agora. Tente novamente.",false);
    APP_REFRESH_BUSY=false;
    APP_REFRESH_HIDE=setTimeout(hideAppRefresh,2600);
  }
}
document.addEventListener("touchstart",event=>{
  if(event.touches.length!==1||APP_REFRESH_BUSY||window.scrollY>1)return;
  if(view==="form"||view==="unqualifiedForm"||OF||UF||CLIENT_REG_OPEN)return;
  const target=event.target;
  if(target&&target.closest&&target.closest("input,textarea,select,a,button,nav,.photo-crop-overlay,.photo-viewer-overlay,#dlg,#lock,[contenteditable=true]"))return;
  const touch=event.touches[0];
  APP_PULL={startY:touch.clientY,startX:touch.clientX,claimed:false};
},{passive:true});
document.addEventListener("touchmove",event=>{
  if(!APP_PULL||!event.touches.length||APP_REFRESH_BUSY)return;
  const touch=event.touches[0],dy=touch.clientY-APP_PULL.startY,dx=touch.clientX-APP_PULL.startX;
  if(dy>16&&dy>Math.abs(dx)*1.25&&window.scrollY<=1){
    APP_PULL.claimed=true;
    appRefreshIndicator(dy>=76?"Solte para atualizar":"Puxe para atualizar",false);
    if(event.cancelable)event.preventDefault();
  }else if(Math.abs(dx)>30||dy<0){APP_PULL=null;hideAppRefresh()}
},{passive:false});
document.addEventListener("touchend",event=>{
  if(!APP_PULL)return;
  const start=APP_PULL;APP_PULL=null;
  const touch=event.changedTouches&&event.changedTouches[0];if(!touch)return;
  const dy=touch.clientY-start.startY,dx=touch.clientX-start.startX;
  if(start.claimed&&dy>=76&&dy>Math.abs(dx)*1.25&&window.scrollY<=1)refreshAppNow();
  else hideAppRefresh();
},{passive:true});
document.addEventListener("touchcancel",()=>{APP_PULL=null;hideAppRefresh()},{passive:true});

function finAggregate(months){

function finMergedItems(months,key){
  const map=new Map();

    const id=String(x.name||"").trim().toLowerCase();
    if(!id)return;
    const item=map.get(id)||{name:x.name,qty:0,value:0,subscription:!!x.subscription};
    item.qty+=finN(x.qty);item.value+=finN(x.value);item.subscription=item.subscription||!!x.subscription;
    map.set(id,item);
  }));

function finNormalizeServiceName(name){
  return String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
}
function finIsSubscriptionItem(item){
  return !!(item&&item.subscription)||/\bass\b|assin/i.test(String(item&&item.name||""));
}
function finExpandServiceItem(item){
  if(finIsSubscriptionItem(item))return [];
  const name=finNormalizeServiceName(item&&item.name),qty=Math.max(0,finN(item&&item.qty));
  if(!name||!qty)return [];
  let rest=name.replace(/barba terapia/g," ").replace(/terapia da barba/g," ");
  const out=[],add=(label,count,kind)=>{if(count>0)out.push({name:label,qty:qty*count,value:kind==="servicos"?finN(item.value):0,subscription:false,kind});};
  const cut=(rest.match(/\bcorte\b/g)||[]).length;
  const beard=(rest.match(/\bbarba\b/g)||[]).length;
  if(cut)add("Corte",cut,"servicos");
  if(beard)add("Barba",beard,"servicos");
  const extras=[
    ["Sobrancelha",/\bsobrancelh\w*/g],
    ["Desondulação",/\bdesondul\w*/g],
    ["Depilação",/\bdepil\w*/g],
    ["Selagem",/\bselagem\b/g],
    ["Raspagem",/\braspagem\b/g],
    ["Acabamento",/\bacabamento\b/g],
    ["Terapia capilar",/\bterapia capilar\b/g],
    ["Hidratação",/\bhidrat\w*/g],
    ["Camuflagem",/\bcamuflagem\b/g],
    ["Barba terapia",/\bbarba terapia\b/g]
  ];
  extras.forEach(([label,re])=>{const count=(name.match(re)||[]).length;if(count)add(label,count,"extras")});
  const matched=cut+beard+extras.reduce((n,[,re])=>n+(name.match(re)||[]).length,0);
  if(!matched)out.push({name:String(item.name||"Serviço"),qty,value:finN(item.value),subscription:false,kind:"extras"});
  return out;
}
function finServiceKind(name){
  const item=finExpandServiceItem({name,qty:1,value:0});
  return item.some(x=>x.kind==="servicos")?"servicos":"extras";
}
function finServiceUnits(item){return Math.max(0,finN(item&&item.qty));}
function finExpandServiceMonth(month){
  return (Array.isArray(month&&month.serviceItems)?month.serviceItems:[]).flatMap(finExpandServiceItem);
}
function finExpandedServiceItems(months){
  const map=new Map();
  months.forEach(m=>(Array.isArray(m.serviceItems)?m.serviceItems:[]).forEach(source=>{
    finExpandServiceItem(source).forEach(x=>{
      const key=x.kind+"|"+finNormalizeServiceName(x.name),item=map.get(key)||{name:x.name,qty:0,value:0,subscription:false,kind:x.kind};
      item.qty+=x.qty;item.value+=x.value;map.set(key,item);
    });
  }));
  return [...map.values()].sort((a,b)=>b.value-a.value||b.qty-a.qty||a.name.localeCompare(b.name));
}
function finMonthServiceCount(month){
  if(Array.isArray(month&&month.serviceItems)&&month.serviceItems.length)return month.serviceItems.reduce((sum,item)=>sum+finServiceUnits(item),0);
  return Math.max(0,finN(month&&month.serviceCount));

function finSaveMonth(){

    period:f.period,launches:Math.max(0,Math.round(finParseAmount(f.launches))),customers:Math.max(0,Math.round(finParseAmount(f.customers))),
    serviceCount:serviceCount,serviceGross:serviceGross,serviceCommission:Math.max(0,finParseAmount(f.serviceCommission)),

    reportedExpenses:Math.max(0,finParseAmount(f.reportedExpenses)),serviceItems:serviceItems,productItems:productItems,updatedAt:new Date().toISOString()
  };

      '<section class="finance-panel"><h2>Vendas por mês</h2><div class="hint">Comparação de vendas brutas de serviços e produtos ao longo de '+FIN_YEAR+'.</div><div class="finance-chart">'+finChart(FIN_YEAR,"revenue",FIN_MONTH)+'</div><div class="finance-legend"><span><i style="background:#d6aa5c"></i>Serviços</span><span><i style="background:#5fc08a"></i>Produtos</span></div></section>'+
      '<section class="finance-panel"><h2>Volume vendido por mês</h2><div class="hint">Quantidade de serviços e unidades de produtos informadas em cada mês.</div><div class="finance-chart">'+finChart(FIN_YEAR,"volume",FIN_MONTH)+'</div><div class="finance-legend"><span><i style="background:#d6aa5c"></i>Serviços</span><span><i style="background:#5fc08a"></i>Produtos</span></div></section>'+
      finSelectedMonthDetail()+finComparePanel(total,finPrevMonths(),FIN_MONTH==="all"?"ano anterior":"mês anterior")+
      '<section class="finance-panel"><h2>Como ler os números</h2><div class="hint">Venda bruta é o valor total vendido em serviços e produtos. Entradas são as comissões e extras informados no relatório, sem confundir esse valor com o total vendido. A comissão prevista de assinaturas fica separada para não misturar projeção com dinheiro confirmado. Na visão anual, clientes atendidos é a soma dos números mensais; a mesma pessoa pode aparecer em mais de um mês.</div></section>'+
      '<section class="finance-panel"><div class="row"><div><h2>Meses cadastrados</h2><div class="hint">Cada mês guarda seu próprio resumo e detalhamento.</div></div><button class="finance-link" onclick="finNewMonth()">Adicionar</button></div>'+finMonthRows(months)+'</section>'+
      '<div class="finance-panel"><div class="hint">Assinaturas: '+finInt(subs)+' serviços de assinatura listados no período. A comissão prevista fica separada das entradas confirmadas para não somar valores diferentes como se fossem a mesma coisa.</div></div>';
  }else if(FIN_TAB==="servicos"){
    const categoryItems=finMonthGroupItems(finStore().months,FIN_SERVICE_GROUP);
    const periodItems=finMonthGroupItems(months,FIN_SERVICE_GROUP);
    const allowedServiceNames=FIN_SERVICE_GROUP==="extras"?new Set(["Sobrancelha","Desondulação","Depilação","Selagem","Raspagem","Acabamento","Terapia capilar","Hidratação","Camuflagem","Barba terapia"]):new Set(["Corte","Barba"]);
    const names=[...new Map(categoryItems.filter(x=>allowedServiceNames.has(x.name)).map(x=>[finNormalizeServiceName(x.name),x.name])).values()].sort((a,b)=>a.localeCompare(b));
    const options='<option value="all" '+(FIN_SERVICE_FILTER==="all"?"selected":"")+'>Todos</option>'+names.map(name=>'<option value="'+esc(name)+'" '+(finNormalizeServiceName(FIN_SERVICE_FILTER)===finNormalizeServiceName(name)?"selected":"")+'>'+esc(name)+'</option>').join("");
    const selectedItems=finSelectedServiceItems(months);
    const selectedQty=selectedItems.reduce((n,x)=>n+finServiceUnits(x),0),selectedValue=selectedItems.reduce((n,x)=>n+finN(x.value),0);
    const allCategoryQty=periodItems.reduce((n,x)=>n+finServiceUnits(x),0),allCategoryValue=periodItems.reduce((n,x)=>n+finN(x.value),0);
    body='<div class="finance-service-groups"><button class="'+(FIN_SERVICE_GROUP==="servicos"?"on":"")+'" onclick="FIN_SERVICE_GROUP=\'servicos\';FIN_SERVICE_FILTER=\'all\';FIN_SERVICE_DETAIL_PERIOD=null;render()">Serviços</button><button class="'+(FIN_SERVICE_GROUP==="extras"?"on":"")+'" onclick="FIN_SERVICE_GROUP=\'extras\';FIN_SERVICE_FILTER=\'all\';FIN_SERVICE_DETAIL_PERIOD=null;render()">Serviços extras</button></div>'+
      '<div class="finance-service-filter"><label>Filtrar '+(FIN_SERVICE_GROUP==="servicos"?"serviço":"serviço extra")+'<select onchange="FIN_SERVICE_FILTER=this.value;FIN_SERVICE_DETAIL_PERIOD=null;render()">'+options+'</select></label><div class="hint" style="margin-top:6px">Selecione um item para acompanhar a quantidade e o valor vendido mês a mês.</div></div>'+
      '<div class="finance-kpis">'+finKpi(FIN_SERVICE_FILTER==="all"?(FIN_SERVICE_GROUP==="servicos"?"Serviços realizados":"Serviços extras realizados"):"Quantidade realizada",finInt(FIN_SERVICE_FILTER==="all"?allCategoryQty:selectedQty),finInt(FIN_SERVICE_FILTER==="all"?periodItems.length:selectedItems.length)+" tipos de serviço no detalhamento")+finKpi("Valor vendido",finBRL(FIN_SERVICE_FILTER==="all"?allCategoryValue:selectedValue),"Total no período selecionado")+'</div>'+
      '<section class="finance-panel"><h2>Quantidade por mês · '+(FIN_SERVICE_GROUP==="servicos"?"Serviços principais":"Serviços extras")+'</h2><div class="hint">Veja os 12 meses do ano, arraste o gráfico para os lados e toque em uma barra para abrir os detalhes daquele mês. O valor vendido aparece na tabela abaixo.</div>'+finMonthlyCategoryChart("services")+'</section>'+
      (FIN_SERVICE_GROUP==="servicos"?'<section class="finance-panel"><h2>Serviços por tipo</h2>'+finTable(selectedItems.map(x=>({name:x.name,qty:finServiceUnits(x),value:x.value,subscription:x.subscription})),"Não há serviços principais detalhados neste período.")+'</section>':"")+
      finServiceMonthDetail();
  }else if(FIN_TAB==="produtos"){
    const list=finMergedItems(months,"productItems");
    body='<div class="finance-kpis">'+finKpi("Unidades vendidas",finInt(total.productCount),"Quantidade de produtos")+finKpi("Venda bruta",finBRL(total.productGross),"Valor vendido em produtos")+finKpi("Comissão de produtos",finBRL(total.productCommission),"Comissão informada nos relatórios")+'</div>'+
      '<section class="finance-panel"><h2>Quantidade de produtos por mês</h2><div class="hint">Veja os 12 meses do ano, arraste o gráfico para os lados e toque em uma barra para abrir os detalhes daquele mês.</div>'+finMonthlyCategoryChart("products")+'</section>'+finSelectedMonthDetail()+
      '';
  }else if(FIN_TAB==="assinaturas"){
    const list=finDetailListt(months).subscriptions;
    body='<div class="finance-kpis">'+finKpi("Serviços de assinatura",finInt(finSubscriptionCount(months)),"Quantidade detalhada no relatório")+finKpi("Comissão prevista",finBRL(total.subscriptionCommission),"Valor projetado pelo relatório")+'</div>'+
      '<section class="finance-panel"><h2>Assinaturas por mês</h2><div class="hint">Acompanhe a quantidade de serviços vinculados às assinaturas e a comissão prevista em cada mês. Arraste o gráfico para os lados e toque em um mês para selecionar o período.</div>'+finSubscriptionMonthlyChart()+'</section>'+
      '<section class="finance-panel"><h2>Serviços realizados por assinatura</h2><div class="hint">Estes itens aparecem com valor de venda zero no relatório, por serem serviços vinculados às assinaturas.</div>'+finTable(list,"Não há itens de assinatura detalhados neste período.")+'</section>'+
      '<section class="finance-panel"><h2>Como interpretar</h2><div class="hint">A comissão prevista de assinaturas é mostrada separadamente. Ela não é somada às entradas confirmadas enquanto não houver um valor efetivamente lançado.</div></section>';
  }else if(FIN_TAB==="comissoes"){
    const monthRows=months.map(m=>'<tr><td>'+finMonthLabel(m.period)+'</td><td>'+finBRL(m.serviceCommission)+'</td><td>'+finBRL(m.productCommission)+'</td><td>'+finBRL(m.subscriptionCommission)+'</td></tr>').join("");
    body='<div class="finance-kpis">'+finKpi("Comissão serviços avulsos",finBRL(total.serviceCommission),"Relatório do mês")+finKpi("Comissão produtos",finBRL(total.productCommission),"Relatório do mês")+finKpi("Comissão prevista assinaturas",finBRL(total.subscriptionCommission),"Projeção separada")+finKpi("Comissões + extras",finBRL(total.income),"Entradas confirmadas + extras","primary")+'</div>'+
      '<section class="finance-panel"><h2>Comissões por mês</h2><div class="finance-table-wrap"><table class="finance-table"><thead><tr><th>Mês</th><th>Serviços</th><th>Produtos</th><th>Assinaturas previstas</th></tr></thead><tbody>'+(monthRows||'<tr><td colspan="4">Sem dados no período.</td></tr>')+'</tbody></table></div></section>'+
      '<section class="finance-panel"><div class="hint">A comissão prevista de assinaturas não está incluída em “Entradas / comissões”. Isso evita confundir uma previsão com uma entrada efetivamente lançada.</div></section>';
  }else if(FIN_TAB==="lancamentos"){
    const mov=total.movements.slice().sort((a,b)=>b.date.localeCompare(a.date));
    const rows=mov.map(x=>'<tr><td>'+br(x.date)+'</td><td>'+esc(x.description)+'<br><span class="finance-pill">'+esc(x.category||"Outros")+'</span></td><td>'+(x.type==="entrada"?"Entrada":"Saída")+'</td><td>'+finBRL(x.amount)+'</td><td><button class="finance-link" onclick="finDeleteMovement(\''+x.id+'\')">Excluir</button></td></tr>').join("");
    body='<div class="finance-kpis">'+finKpi("Entradas",finBRL(total.income),"Comissões + extras + entradas manuais","green")+finKpi("Saldo",finBRL(total.net),"Entradas menos despesas",total.net<0?"red":"green")+'</div>'+
      '<section class="finance-panel"><div class="row"><div><h2>Movimentações manuais</h2><div class="hint">Compras, vales, extras e outras entradas ou saídas.</div></div><button class="btn" onclick="finNewMovement()">+ Lançamento</button></div>'+
      (rows?'<div class="finance-table-wrap"><table class="finance-table"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="finance-empty">Nenhum lançamento manual neste período.</div>')+
      '</section>';
  }
  $("#app").innerHTML='<div class="finance-page">'+header+tabHtml+body+'</div>';
}
function finDeleteMonth(period){
  askC("Excluir o relatório de "+finMonthLabel(period)+"? As movimentações manuais daquele mês serão mantidas.",()=>{finStore().months=finStore().months.filter(x=>x.period!==period);save();render()});
}


init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./sw.js", {
        scope: "./",
        updateViaCache: "none"
      });
      await registration.update();
    } catch (error) {
      console.warn("Não consegui atualizar o aplicativo instalado:", error);
    }
  });
}
</script></body></html>

<script>
const SUPABASE_URL="https://zkfgobmgwxbklwgwlhyu.supabase.co";
const SUPABASE_KEY="sb_publishable_paXVsr9OplmsTNraw528Eg_POKNDRA0";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cloudUser=null,cloudReady=false,cloudTimer=null,cloudQueue=Promise.resolve();

const Q={qualificado:"Qualificado",nao_qualificado:"Sem potencial",nao_avaliado:"Não avaliado"},

ff=(c,v)=>!v||(v[0]=="f"?(c.freq>0&&c.freq<=+v.slice(1)):c.st==v),
SL={sem_frequencia:"Sem frequência",atrasado:"Atrasado",hoje:"Retorno hoje",proximo:"Próximos 7 dias",em_dia:"Em dia"};
let S={clients:[]},view="painel",cur=null,tab="hoje",F={q:"",qual:"",status:"",tipo:"",sub:"todos"},form=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const U=s=>{const[a,b,c]=s.split("-").map(Number);return Date.UTC(a,b-1,c)};
const add=(s,n)=>new Date(U(s)+n*864e5).toISOString().slice(0,10);
const br=s=>s?s.split("-").reverse().join("/"):"—";
const next=c=>c.last&&c.freq>0?add(c.last,+c.freq):null;
function status(c){const n=next(c);if(!n)return"sem_frequencia";const d=Math.round((U(n)-U(iso()))/864e5);return d<0?"atrasado":d==0?"hoje":d<=7?"proximo":"em_dia"}
const rows=()=>S.clients.map(c=>({...c,nx:next(c),st:status(c)}));
const byNx=(a,b)=>(a.nx||"").localeCompare(b.nx||"");
function wa(c){let d=(c.phone||"").replace(/\D/g,"");if(d.length<10)return null;if(d.length<=11)d="55"+d;
return`https://wa.me/${d}?text=`+encodeURIComponent(`Fala, ${c.name.trim().split(/\s+/)[0]}! Tudo certo? Já está chegando a hora de dar aquela ajustada no corte. Quer que eu veja um horário pra você?`)}
/* persistência: db (privado do usuário) com fallback em localStorage */
function save(){
  try{localStorage.setItem("carteira",JSON.stringify(S))}catch(e){}
  if(cloudUser&&cloudReady){
    clearTimeout(cloudTimer);
    cloudTimer=setTimeout(()=>syncCloud(),450);
  }
}
async function syncCloud(){
  if(!cloudUser||!cloudReady)return false;
  const snapshot=JSON.parse(JSON.stringify(S));
  cloudQueue=cloudQueue.then(async()=>{
    const {error}=await sb.from("carteira_data").upsert(
      {user_id:cloudUser.id,data:snapshot,updated_at:new Date().toISOString()},
      {onConflict:"user_id"}
    );
    if(error){
      console.error("Supabase save:",error);
      toast("Não consegui sincronizar. Confira sua conexão.");
      return false;
    }
    toast("Dados sincronizados na nuvem.");
    return true;
  }).catch(e=>{
    console.error("Supabase save:",e);
    toast("Não consegui sincronizar. Confira sua conexão.");
    return false;
  });
  return cloudQueue;
}
function authView(message=""){
  cloudReady=false;$("#nav").style.display="none";$("#lock").classList.remove("on");
  $("#app").innerHTML=`<div style="max-width:390px;margin:8vh auto 0">
  <div class="logo" style="width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#e7bd7a,#b98846);display:grid;place-items:center;color:#1b1608;font-size:26px">✂</div>
  <h1>Carteira</h1><p class="sub">Entre na sua conta para acessar seus clientes em qualquer aparelho.</p>
  <div class="card" style="margin-top:20px">
  <label>E-mail<input id="authEmail" type="email" autocomplete="email" placeholder="seu@email.com"></label>
  <label>Senha<input id="authPass" type="password" autocomplete="current-password" placeholder="Sua senha"></label>
  <div id="authMsg" class="sub" style="margin:10px 0;color:var(--bad)">${esc(message)}</div>
  <button class="btn" style="width:100%" onclick="signIn()">Entrar</button>
  <button class="btn alt" style="width:100%;margin-top:8px" onclick="signUp()">Criar conta</button>

  </div><p class="sub">Se você já tem cadastro no Supabase, use o mesmo e-mail e a senha definida para essa conta.</p></div>`;
}
async function signIn(){
  const email=$("#authEmail").value.trim(),password=$("#authPass").value;
  if(!email||!password){authView("Preencha e-mail e senha.");return}
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){authView(error.message);return}
  await bootCloud();
}
async function signUp(){
  const email=$("#authEmail").value.trim(),password=$("#authPass").value;
  if(!email||password.length<6){authView("Informe um e-mail e uma senha com pelo menos 6 caracteres.");return}
  const {error}=await sb.auth.signUp({email,password});
  if(error){authView(error.message);return}
  authView("Cadastro enviado. Se a confirmação por e-mail estiver ativa, confirme o endereço e depois entre.");
}
async function resetPassword(){
  const email=$("#authEmail").value.trim();
  if(!email){authView("Digite seu e-mail primeiro.");return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});
  authView(error?"Erro ao enviar recuperação: "+error.message:"Enviamos um link de recuperação para seu e-mail.");

async function signOut(){
  await syncCloud();await sb.auth.signOut();cloudUser=null;cloudReady=false;authView("Você saiu da sua conta.");
}
async function bootCloud(){
  const {data:{session},error:sessionError}=await sb.auth.getSession();
  if(sessionError||!session){cloudUser=null;authView();return}
  cloudUser=session.user;$("#nav").style.display="flex";

  else if(local&&Array.isArray(local.clients)&&(local.clients.length||(local.crm||[]).length)){
    S=local;cloudReady=true;await syncCloud();
  }else{
    S=local&&Array.isArray(local.clients)?local:{clients:[],crm:[],cfg:{}};
    cloudReady=true;await syncCloud();
  }
  cloudReady=true;render();lockUI();
}
async function init(){
  try{const l=localStorage.getItem("carteira");if(l)S=JSON.parse(l)}catch(e){}

}

// Iniciais automáticas quando o cliente não tem foto
function initials(name){
  return String(name||"?").trim().split(/\s+/).slice(0,2)
    .map(part=>part[0]||"").join("").toUpperCase()||"?";
}

// Carrega a foto a partir de uma URL temporária e privada do Supabase
async function refreshPhotoUrls(){
  if(!cloudUser||!sb)return;
  for(const el of document.querySelectorAll("[data-photo-path]")){
    const path=el.getAttribute("data-photo-path");
    if(!path)continue;
    try{
      let signedUrl;
      const cached=photoUrlCache[path];
      if(cached&&cached.expires>Date.now()){
        signedUrl=cached.url;
      }else{
        const {data,error}=await sb.storage.from(PHOTO_BUCKET).createSignedUrl(path,3600);
        if(error)throw error;
        signedUrl=data.signedUrl;
        photoUrlCache[path]={url:signedUrl,expires:Date.now()+3300000};
      }
      const img=document.createElement("img");
      img.src=signedUrl;
      img.alt="Foto do cliente";
      el.replaceChildren(img);
    }catch(error){
      console.error("Erro ao carregar foto:",error);
    }
  }
}

// Abre o editor para enquadrar a foto antes do envio
function openPhotoCrop(input,id){
  const file=input.files&&input.files[0];
  input.value="";
  if(!file)return;
  if(!cloudUser){toast("Entre na sua conta para enviar fotos.");return;}
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    toast("Use uma imagem JPG, PNG ou WebP.");return;
  }
  if(file.size>5*1024*1024){toast("A imagem precisa ter até 5 MB.");return;}
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    photoCrop={id,file,img,url,zoom:1,x:0,y:0,scale:1,dragging:false};
    const modal=$("#photoCrop");
    modal.innerHTML =
      '<div class="photo-crop-card">' +
        '<h2 class="photo-crop-title">Ajustar foto</h2>' +
        '<p class="sub" style="margin:4px 0 0">Posicione o rosto dentro do quadrado.</p>' +
        '<div id="photoCropViewport" class="photo-crop-viewport" ' +
          'onpointerdown="startPhotoDrag(event)" ' +
          'onpointermove="movePhotoDrag(event)" ' +
          'onpointerup="endPhotoDrag(event)" ' +
          'onpointercancel="endPhotoDrag(event)">' +
          '<img id="photoCropImage" class="photo-crop-image" alt="Prévia do enquadramento">' +
        '</div>' +
        '<div class="photo-crop-help">Arraste a foto para centralizar. Ajuste o zoom até ficar do jeito que você quer.</div>' +
        '<label class="photo-crop-zoom">Zoom' +
          '<input id="photoZoom" type="range" min="1" max="3" step="0.01" value="1" oninput="setPhotoZoom(this.value)">' +
        '</label>' +
        '<div class="photo-crop-actions">' +
          '<button class="btn alt" onclick="cancelPhotoCrop()">Cancelar</button>' +
          '<button id="photoCropSave" class="btn" onclick="confirmPhotoCrop()">Usar esta foto</button>' +
        '</div>' +
      '</div>';
    modal.classList.add("on");
    modal.setAttribute("aria-hidden","false");
    requestAnimationFrame(()=>{
      const viewport=$("#photoCropViewport");
      const size=viewport.clientWidth;
      const scale=Math.max(size/img.naturalWidth,size/img.naturalHeight);
      photoCrop.scale=scale;
      photoCrop.x=(size-img.naturalWidth*scale)/2;
      photoCrop.y=(size-img.naturalHeight*scale)/2;
      $("#photoCropImage").src=url;
      drawPhotoCrop();
    });
  };
  img.onerror=()=>{
    URL.revokeObjectURL(url);
    toast("Não consegui abrir essa imagem. Tente outra foto.");
  };
  img.src=url;
}

function drawPhotoCrop(){
  if(!photoCrop)return;
  const viewport=$("#photoCropViewport");
  const image=$("#photoCropImage");
  if(!viewport||!image)return;
  const size=viewport.clientWidth;
  const width=photoCrop.img.naturalWidth*photoCrop.scale;
  const height=photoCrop.img.naturalHeight*photoCrop.scale;
  photoCrop.x=Math.min(0,Math.max(size-width,photoCrop.x));
  photoCrop.y=Math.min(0,Math.max(size-height,photoCrop.y));
  image.style.width=width+"px";
  image.style.height=height+"px";
  image.style.left=photoCrop.x+"px";
  image.style.top=photoCrop.y+"px";
}

function setPhotoZoom(value){
  if(!photoCrop)return;
  const viewport=$("#photoCropViewport");
  const size=viewport.clientWidth;
  const focusX=(size/2-photoCrop.x)/photoCrop.scale;
  const focusY=(size/2-photoCrop.y)/photoCrop.scale;
  const base=Math.max(size/photoCrop.img.naturalWidth,size/photoCrop.img.naturalHeight);
  photoCrop.zoom=Number(value);
  photoCrop.scale=base*photoCrop.zoom;
  photoCrop.x=size/2-focusX*photoCrop.scale;
  photoCrop.y=size/2-focusY*photoCrop.scale;
  drawPhotoCrop();
}

function startPhotoDrag(event){
  if(!photoCrop)return;
  event.preventDefault();
  photoCrop.dragging=true;
  photoCrop.pointerId=event.pointerId;
  photoCrop.startPointerX=event.clientX;
  photoCrop.startPointerY=event.clientY;
  photoCrop.startX=photoCrop.x;
  photoCrop.startY=photoCrop.y;
  event.currentTarget.setPointerCapture(event.pointerId);
}
function movePhotoDrag(event){
  if(!photoCrop||!photoCrop.dragging||event.pointerId!==photoCrop.pointerId)return;
  event.preventDefault();
  photoCrop.x=photoCrop.startX+(event.clientX-photoCrop.startPointerX);
  photoCrop.y=photoCrop.startY+(event.clientY-photoCrop.startPointerY);
  drawPhotoCrop();
}
function endPhotoDrag(event){
  if(!photoCrop||!photoCrop.dragging)return;
  if(event.pointerId!==undefined&&event.pointerId!==photoCrop.pointerId)return;
  photoCrop.dragging=false;
}
function cancelPhotoCrop(){
  if(photoCrop&&photoCrop.url)URL.revokeObjectURL(photoCrop.url);
  photoCrop=null;
  const modal=$("#photoCrop");
  modal.classList.remove("on");
  modal.setAttribute("aria-hidden","true");
  modal.innerHTML="";
}

async function confirmPhotoCrop(){
  if(!photoCrop)return;
  const button=$("#photoCropSave");
  button.disabled=true;
  button.textContent="Preparando...";
  try{
    const viewport=$("#photoCropViewport");
    const size=viewport.clientWidth;
    const canvas=document.createElement("canvas");
    canvas.width=1024;
    canvas.height=1024;
    const ctx=canvas.getContext("2d");
    const sx=Math.max(0,(0-photoCrop.x)/photoCrop.scale);
    const sy=Math.max(0,(0-photoCrop.y)/photoCrop.scale);
    const sw=Math.min(size/photoCrop.scale,photoCrop.img.naturalWidth-sx);
    const sh=Math.min(size/photoCrop.scale,photoCrop.img.naturalHeight-sy);
    ctx.drawImage(photoCrop.img,sx,sy,sw,sh,0,0,1024,1024);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.92));
    if(!blob)throw new Error("Não consegui preparar o recorte da foto.");
    const originalName=(photoCrop.file.name||"foto").replace(/\.[^.]+$/,"");
    const file=new File([blob],originalName+".jpg",{type:"image/jpeg",lastModified:Date.now()});
    const id=photoCrop.id;
    cancelPhotoCrop();
    await uploadClientPhoto(file,id);
  }catch(error){
    console.error("Erro ao ajustar foto:",error);
    button.disabled=false;
    button.textContent="Usar esta foto";
    toast("Não consegui preparar a foto: "+(error.message||"tente novamente."));
  }
}

// Enviar ou trocar foto
async function uploadClientPhoto(file,id){
  if(!file)return;
  if(!cloudUser){toast("Entre na sua conta para enviar fotos.");return;}
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    toast("Use uma imagem JPG, PNG ou WebP.");return;
  }
  if(file.size>5*1024*1024){toast("A imagem precisa ter até 5 MB.");return;}
  const client=S.clients.find(item=>item.id==id);
  if(!client)return;
  const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
  const path=cloudUser.id+"/"+id+"/"+Date.now()+"."+ext;
  try{
    toast("Enviando foto...");
    const {error}=await sb.storage.from(PHOTO_BUCKET).upload(path,file,{
      upsert:false,contentType:file.type
    });
    if(error)throw error;
    const previousPath=client.photo||"";
    client.photo=path;
    save();
    clearTimeout(cloudTimer);
    const synced=await syncCloud();
    if(!synced){
      client.photo=previousPath;
      save();
      clearTimeout(cloudTimer);
      await syncCloud();
      await sb.storage.from(PHOTO_BUCKET).remove([path]);
      throw new Error("A foto foi enviada, mas o cadastro não foi confirmado na nuvem. Tente novamente.");
    }
    if(previousPath){
      const {error:removeError}=await sb.storage.from(PHOTO_BUCKET).remove([previousPath]);
      if(removeError)console.warn("A foto antiga não foi removida:",removeError);
      delete photoUrlCache[previousPath];
    }
    delete photoUrlCache[path];
    render();
    await refreshPhotoUrls();
    toast("Foto salva e sincronizada!");
  }catch(error){
    console.error("Erro ao enviar foto:",error);
    toast("Não consegui enviar a foto: "+(error.message||"verifique sua conexão."));
  }
}

// Remover a foto sem apagar o cadastro ou o histórico
function removeClientPhoto(id){
  const client=S.clients.find(item=>item.id==id);
  if(!client||!client.photo)return;
  askC("Deseja remover a foto deste cliente?",async()=>{
    const path=client.photo;
    try{
      client.photo="";
      delete photoUrlCache[path];
      save();
      clearTimeout(cloudTimer);
      const synced=await syncCloud();
      if(!synced){
        client.photo=path;
        save();
        clearTimeout(cloudTimer);
        await syncCloud();
        throw new Error("Não consegui confirmar a remoção na nuvem.");
      }
      const {error}=await sb.storage.from(PHOTO_BUCKET).remove([path]);
      if(error)console.warn("Não consegui apagar o arquivo antigo:",error);
      render();
      toast("Foto removida e sincronizada!");
    }catch(error){
      console.error("Erro ao remover foto:",error);
      toast("Não consegui remover a foto: "+(error.message||"tente novamente."));
    }
  },"Remover foto");
}

return`<div class="oc" draggable="true" ondragstart="event.dataTransfer.setData('text','${o.id}')" onclick="editO('${o.id}')"><div class="row"><span class="nm" style="font-size:14px">${esc(o.name)}</span><span class="badge">${o.tipo=="produto"?"Produto":"Serviço"}</span></div><div class="row meta"><span>${esc(o.item||"—")}</span>${o.value?`<span class="vl">${BRL(o.value)}</span>`:""}</div>${o.stage=="followup"?`<select class="sbs" style="color:${c};border-color:${c||"var(--bd)"};background:${c?c+"22":"var(--mut)"}" onclick="event.stopPropagation()" onchange="subO(this,'${o.id}')"><option value="">Situação…</option>${SUB.map(s=>`<option ${o.sub==s?"selected":""}>${s}</option>`).join("")}</select>`:""}<div class="row fu"><span>Último follow-up</span><span style="display:flex;align-items:center"><input type="date" class="fud" value="${o.lastfu||""}" onclick="event.stopPropagation()" onchange="fuSet(this,'${o.id}')"><button class="hj" title="Marcar hoje" onclick="event.stopPropagation();fuToday(this,'${o.id}')">Hoje</button></span></div><div class="row ac">${w?`<a class="wab" href="${w}" target="_blank" rel="noopener" onclick="event.stopPropagation();fuO('${o.id}')">WhatsApp</a>`:"<span></span>"}<span>${i>0?`<button class="ico" title="Etapa anterior" onclick="event.stopPropagation();moveO('${o.id}',-1)">‹</button>`:""}${i<ST.length-1?`<button class="ico" title="Próxima etapa" onclick="event.stopPropagation();moveO('${o.id}',1)">›</button>`:""}</span></div></div>`}
let ME=null,UNL=false,hid=0,PF=false;
const cfg=()=>S.cfg=S.cfg||{},svList=()=>cfg().serv||SERV;
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("carteira:"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function lockUI(){const el=$("#lock");if(!cfg().pin||UNL){el.classList.remove("on");return}el.classList.add("on");
el.innerHTML=`<div class="lbox"><div class="logo">${sv(IC.logo)}</div><h1 style="margin:0">Carteira</h1><div class="sub" style="margin-top:6px">${ME&&ME.name?"Olá, "+esc(ME.name.split(" ")[0])+". ":""}Digite seu PIN para entrar.</div><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" onkeydown="if(event.key=='Enter')unlock()"><div class="sub" id="perr" style="color:var(--bad);min-height:18px;margin-bottom:8px"></div><button class="btn" style="width:100%" onclick="unlock()">Entrar</button></div>`;setTimeout(()=>{const p=$("#pin");if(p)p.focus()},50)}
async function unlock(){if(await sha($("#pin").value)==cfg().pin){UNL=true;lockUI()}else{$("#perr").textContent="PIN incorreto.";$("#pin").value=""}}
function lockNow(){UNL=false;lockUI()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="hidden")hid=Date.now();else if(cfg().pin&&hid&&Date.now()-hid>3e5){UNL=false;lockUI()}});
async function savePin(){const g=i=>($("#"+i)||{}).value||"",m=$("#pm");
if(cfg().pin&&await sha(g("p0"))!=cfg().pin){m.textContent="PIN atual incorreto.";return}
if(PF=="rm"){delete cfg().pin;PF=false;save();lockUI();ajView();return}
if(!/^\d{4,6}$/.test(g("p1"))){m.textContent="Use de 4 a 6 números.";return}
if(g("p1")!=g("p2")){m.textContent="Os PINs não conferem.";return}
cfg().pin=await sha(g("p1"));UNL=true;PF=false;save();lockUI();ajView()}
function addServ(){const v=$("#ns").value.trim();if(!v)return;const a=svList();if(!a.includes(v)){cfg().serv=[...a,v];save()}ajView()}
function rmServ(i){const a=[...svList()];a.splice(i,1);cfg().serv=a;save();ajView()}
function ajView(){const hp=!!cfg().pin,kv2=(l,v)=>`<div class="kv" style="padding:6px 0"><span>${l}</span><b>${esc(v)}</b></div>`;
$("#app").innerHTML=`<h1>Configurações</h1>
<h2>Conta</h2><div class="card">${kv2("Nome",ME&&ME.name||"—")}${kv2("E-mail",ME&&ME.email||"—")}<div class="sub" style="margin-top:6px">Sua conta está conectada ao Supabase. Clientes, histórico, CRM e configurações são sincronizados na nuvem.</div><div class="actions"><button class="btn alt" onclick="syncCloud()">Sincronizar agora</button><button class="btn del" onclick="signOut()">Sair da conta</button></div></div>
<h2>Segurança</h2><div class="card"><div class="row"><div><div class="nm">Bloqueio por PIN</div><div class="sub">${hp?"Ativado. Pede o PIN ao abrir e depois de 5 minutos fora do app.":"Desativado."}</div></div>${hp?`<button class="btn alt" onclick="lockNow()">Bloquear agora</button>`:""}</div>
${PF?`<div style="margin-top:12px">${hp?`<input id="p0" type="password" inputmode="numeric" placeholder="PIN atual">`:""}${PF=="set"?`<input id="p1" type="password" inputmode="numeric" maxlength="6" placeholder="Novo PIN (4 a 6 números)"><input id="p2" type="password" inputmode="numeric" maxlength="6" placeholder="Repita o novo PIN">`:""}<div class="sub" id="pm" style="color:var(--bad);min-height:18px"></div><div class="actions" style="margin-top:6px"><button class="btn" onclick="savePin()">Salvar</button><button class="btn alt" onclick="PF=false;ajView()">Cancelar</button></div></div>`:`<div class="actions"><button class="btn" onclick="PF='set';ajView()">${hp?"Trocar PIN":"Criar PIN"}</button>${hp?`<button class="btn alt" onclick="PF='rm';ajView()">Remover PIN</button>`:""}</div>`}
<div class="sub" style="margin-top:10px">O PIN esconde a tela em aparelhos compartilhados. Os dados continuam guardados no navegador.</div></div>
<h2>Serviços oferecidos</h2><div class="card"><div class="sub">Aparecem como opções no cadastro e ao registrar atendimento. Toque num serviço para remover.</div><div class="chips">${svList().map((s,i)=>`<span class="chip on">${esc(s)}<b class="x" title="Remover" onclick="rmServ(${i})">✕</b></span>`).join("")}</div><div style="display:flex;gap:8px;margin-top:12px"><input id="ns" style="margin:0" placeholder="Novo serviço" onkeydown="if(event.key=='Enter')addServ()"><button class="btn" onclick="addServ()">Adicionar</button></div><div class="actions"><button class="btn alt" onclick="resetServ()">Restaurar lista padrão</button></div></div>
<h2>Dados</h2><div class="card">${kv2("Clientes",S.clients.length)}${kv2("Oportunidades no CRM",crm().length)}<div style="margin-top:12px"><div class="nm">Importar clientes</div><div class="sub" style="margin:4px 0 8px">Arquivo CSV (no Google Sheets: Arquivo → Fazer download → CSV). Colunas aceitas: nome, telefone, instagram, e-mail, qualificação, tipo, visagismo, frequência, último atendimento, observações.</div><input type="file" accept=".csv,text/csv" onchange="importCsv(this)"><div class="sub" id="imsg" style="margin-top:8px"></div></div><div class="actions"><button class="btn alt" onclick="exportCsv()">Exportar clientes (CSV)</button><button class="btn alt" onclick="backupJson()">Backup completo (JSON)</button><button class="btn del" onclick="wipe()">Apagar todos os dados</button></div></div>`}
function resetServ(){delete cfg().serv;save();ajView()}
let FSEC=null;
function editC(sec){FSEC=sec||null;form=JSON.parse(JSON.stringify(S.clients.find(x=>x.id==cur)));view="form";render()}
let DLGF=null,tt;
function askC(msg,fn,lbl){DLGF=fn;const d=$("#dlg");d.innerHTML=`<div class="dbox"><div class="nm" style="margin-bottom:14px">${esc(msg)}</div><div class="actions" style="margin-top:0;justify-content:flex-end"><button class="btn alt" onclick="dlgClose()">Cancelar</button><button class="btn" style="background:var(--bad);color:#fff" onclick="dlgOk()">${lbl||"Excluir"}</button></div></div>`;d.classList.add("on")}
function dlgClose(){DLGF=null;$("#dlg").classList.remove("on")}
function dlgOk(){const f=DLGF;dlgClose();if(f)f()}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3500)}
globalThis.alert=toast;
function delVisit(i){askC("Excluir este atendimento?",()=>{const c=S.clients.find(x=>x.id==cur);c.visits.splice(i,1);c.last=c.visits.reduce((m,v)=>v.date>m?v.date:m,"");save();render()})}
function delNote(id){askC("Excluir esta observação?",()=>{const c=S.clients.find(x=>x.id==cur);c.log=(c.log||[]).filter(n=>n.id!=id);save();render()})}
function delC(){askC("Excluir este cliente e o histórico dele?",()=>{S.clients=S.clients.filter(x=>x.id!=cur);save();go("clientes")})}
function delO(){askC("Excluir esta oportunidade?",()=>{S.crm=crm().filter(x=>x.id!=OF.id);OF=null;save();render()})}
function download(name,type,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backupJson(){download("carteira-backup-"+iso()+".json","application/json",JSON.stringify(S,null,1))}
function restoreJson(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d||!Array.isArray(d.clients))throw 0;askC("Substituir todos os dados atuais por este backup?",()=>{S=d;save();render()},"Restaurar")}catch(e){toast("Arquivo de backup inválido.")}inp.value=""})}
function wipe(){askC("Apagar TODOS os clientes, atendimentos e oportunidades? Isso não pode ser desfeito.",()=>{S={clients:[],crm:[],cfg:S.cfg};save();render()},"Apagar tudo")}
init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./sw.js", {
        scope: "./",
        updateViaCache: "none"
      });
      await registration.update();
    } catch (error) {
      console.warn("Não consegui atualizar o aplicativo instalado:", error);
    }
  });
}
</script></body></html>
